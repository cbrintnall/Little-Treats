plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    maven {
        url = uri("https://maven.puffish.net")
    }
    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven { url "https://maven.architectury.dev/" }
    maven { url "https://maven.shedaniel.me/" }
    exclusiveContent {
        forRepository {
            maven {
                url "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Epherical Maven"
        url = "https://maven.epherical.com/releases"
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.puffish:attributesmod:${attributes_version}+${minecraft_version_vague}:neoforge"

    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly "curse.maven:lets-do-vinery-704465:${lets_do_vinery_file_id}"
    compileOnly "curse.maven:lets-do-farm-charm-1038103:${lets_do_farm_and_charm_file_id}"
    compileOnly "dev.architectury:architectury-neoforge:${arch_version}"
    compileOnly "curse.maven:farmers-delight-398521:${farmers_delight_file_id}"
    compileOnly "curse.maven:croptopia-415438:${croptopia_file_id}"

    // maven was down when I tried this, falling back to curse maven for now..
//    compileOnly "com.epherical.epherolib:EpheroLib-neoforge:1.0.0-${minecraft_version}"

    compileOnly "curse.maven:epherolib-885449:5872111"

    if (project.hasProperty("withJEI")) {
        localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    }

    // will include ALL lets do mods
    if (project.hasProperty("withLetsDo")) {
        localRuntime "curse.maven:lets-do-vinery-704465:${lets_do_vinery_file_id}"
        localRuntime "dev.architectury:architectury-neoforge:${arch_version}"
        localRuntime "curse.maven:lets-do-farm-charm-1038103:${lets_do_farm_and_charm_file_id}"
    }

    if (project.hasProperty("withFarmers")) {
        localRuntime "curse.maven:farmers-delight-398521:${farmers_delight_file_id}"
    }

    if (project.hasProperty("withCroptopia")) {
        localRuntime "curse.maven:croptopia-415438:${croptopia_file_id}"
        localRuntime "curse.maven:epherolib-885449:5872111"
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            attributes_version     : attributes_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' }

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
